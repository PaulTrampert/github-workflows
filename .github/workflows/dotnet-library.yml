name: Dotnet Library Workflow

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      project_name:
        description: "The name of the .NET project to build and test."
        required: true
        type: string
      main_branch:
        description: "The main branch name. Defaults to 'refs/heads/main'."
        required: false
        default: "refs/heads/main"
        type: string
      global_json:
        description: "Path to the global.json file to use for .NET SDK version."
        required: false
        default: "./global.json"
        type: string
    secrets:
      nuget_api_key:
        description: "API key for publishing to NuGet.org"
        required: true

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Check for changes since last tag
      id: check
      run: |
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$LATEST_TAG" ]; then
          echo "No tags found, treating as changed"
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          # Find all non-test .csproj files
          CSPROJ_FILES=$(find . -name "*.csproj" | grep -v Test | grep -v "^\./\." | sort)
          
          if [ -z "$CSPROJ_FILES" ]; then
            echo "No non-test .csproj files found"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            CHANGED=false
            while IFS= read -r csproj; do
              dir=$(dirname "$csproj")
              if ! git diff --quiet "$LATEST_TAG"..HEAD -- "$dir"; then
                echo "Changes detected in $dir"
                CHANGED=true
                break
              fi
            done <<< "$CSPROJ_FILES"
            
            if [ "$CHANGED" = true ]; then
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No changes in non-test projects since $LATEST_TAG"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi
        fi

  version:
    uses: ./.github/workflows/version.yml
    with:
      main_branch: ${{ inputs.main_branch }}

  build-test:
    uses: ./.github/workflows/dotnet-library-build-test.yml
    needs: version
    with:
      project_name: ${{ inputs.project_name }}
      version: ${{needs.version.outputs.version}}
      global_json: ${{ inputs.global_json }}

  publish:
    uses: ./.github/workflows/dotnet-library-publish.yml
    if: ${{ github.ref == inputs.main_branch && needs.check-changes.outputs.has_changes == 'true' }}
    needs:
    - check-changes
    - version
    - build-test
    with:
      version: ${{ needs.version.outputs.version }}
      global_json: ${{ inputs.global_json }}
    secrets:
      nuget_api_key: ${{ secrets.nuget_api_key}}