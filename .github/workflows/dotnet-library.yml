name: Dotnet Library Workflow

on:
  workflow_call:
    inputs:
      project_name:
        description: "The name of the .NET project to build and test."
        required: true
        type: string
      main_branch:
        description: "The main branch name. Defaults to 'refs/heads/main'."
        required: false
        default: "refs/heads/main"
        type: string
      global_json:
        description: "Path to the global.json file to use for .NET SDK version."
        required: false
        default: "./global.json"
        type: string

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Check for changes since last tag
      id: check
      run: |
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$LATEST_TAG" ]; then
          echo "No tags found, treating as changed"
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          if git diff --quiet "$LATEST_TAG"..HEAD -- ${{ inputs.project_name }}/; then
            echo "No changes in ${{ inputs.project_name }}/ since $LATEST_TAG"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in ${{ inputs.project_name }}/ since $LATEST_TAG"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        fi

  version:
    uses: ./.github/workflows/version.yml
    with:
      main_branch: ${{ inputs.main_branch }}

  build-test:
    uses: ./.github/workflows/build-test-dotnet.yml
    needs: version
    with:
      project_name: ${{ inputs.project_name }}
      version: ${{needs.version.outputs.version}}
      global_json: ${{ inputs.global_json }}

  publish-github-release:
    runs-on: ubuntu-latest
    needs: 
    - version
    - build-test
    - check-changes
    if: ${{ github.ref == inputs.main_branch && needs.check-changes.outputs.has_changes == 'true' }}
    steps:
    - uses: actions/download-artifact@v7
        
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.version.outputs.version }}
        files: |
          **/*.nupkg
          **/*.snupkg
        fail_on_unmatched_files: true
        target_commitish: ${{github.sha}}
        generate_release_notes: true
  
  publish-nuget-package:
    runs-on: ubuntu-latest
    needs: 
    - build-test
    - check-changes
    if: ${{ github.ref == inputs.main_branch && needs.check-changes.outputs.has_changes == 'true' }}
    steps:
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    
    - uses: actions/download-artifact@v7
    
    - name: Publish nuget package
      run: dotnet nuget push **/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{secrets.NUGET_ORG_SECRET}}
