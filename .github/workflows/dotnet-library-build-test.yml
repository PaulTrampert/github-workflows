# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Test .NET Library

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      version:
        required: true
        type: string
      global_json:
        required: false
        type: string
        default: './global.json'
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: ${{ inputs.global_json }}
        
    - name: Restore dependencies
      run: dotnet restore ${{inputs.project_name}}.sln
      
    - name: Test
      run: dotnet test ${{inputs.project_name}}.sln
      
    - name: Pack
      run: dotnet pack ${{inputs.project_name}}.sln -c Release -o package --include-source /p:Version=${{inputs.version}}
        
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: package
        path: |
          package/*.nupkg
          package/*.snupkg
    
    
